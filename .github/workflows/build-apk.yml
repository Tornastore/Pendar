name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot templates and Android settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          KS=/tmp/mb-debug.keystore
          rm -f "$KS"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$KS" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          JAVA_HOME_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "${JAVA_HOME_DIR}"
          export/android/debug_keystore = "/tmp/mb-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.tres

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export debug APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/MindBastion.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MindBastion-apk
          path: build/android/MindBastion.apk
