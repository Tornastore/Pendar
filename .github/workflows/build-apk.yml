name: Build Android APK

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Persian fonts (Vazirmatn)
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p fonts
          download_font() {
            local filename="$1"
            local destination="fonts/${filename}"
            local primary_url="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/ttf/${filename}"
            local fallback_url="https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/${filename}"
            if ! wget --tries=2 --waitretry=2 --timeout=20 --output-document="$destination" "$primary_url"; then
              echo "Primary font URL failed; trying fallback for ${filename}." >&2
              rm -f "$destination"
              wget --tries=2 --waitretry=2 --timeout=20 --output-document="$destination" "$fallback_url"
            fi
            test -s "$destination" || { echo "ERROR: Font download failed: ${destination}" >&2; return 1; }
          }
          download_font "Vazirmatn-Regular.ttf"
          download_font "Vazirmatn-Bold.ttf"
          if ! wget --tries=2 --waitretry=2 --timeout=20 -O fonts/OFL.txt "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt"; then
            wget --tries=2 --waitretry=2 --timeout=20 -O fonts/OFL.txt "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/OFL.txt"
          fi
          test -s fonts/OFL.txt
          ls -lh fonts/Vazirmatn-*.ttf fonts/OFL.txt

      - name: Install Android SDK components
        run: |
          SDK=/usr/lib/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          rm -rf /tmp/cmdtools && unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          ls "$SDK" "$SDK/build-tools" "$SDK/platforms" "$SDK/cmdline-tools"

      - name: Setup Godot templates and Android settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          KS=/tmp/mb-debug.keystore
          rm -f "$KS"
          if ! keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$KS" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12; then
            echo "keytool failed, using the keystore that ships with the image"
            KS=/root/debug.keystore
          fi
          echo "Using keystore: $KS"
          ls -la "$KS"
          JAVA_HOME_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "${JAVA_HOME_DIR}"
          export/android/debug_keystore = "${KS}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres

      - name: Import project resources
        shell: bash
        timeout-minutes: 8
        run: godot --headless --editor --path . --import

      - name: Smoke-test game startup
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/mind-bastion-apk-startup.log"
          godot --headless --verbose --path . --quit-after 2 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed loading resource|Failed to load script|Cannot load script' "$LOG_FILE"; then
            echo "ERROR: Godot reported script or resource loading errors during startup." >&2
            exit 1
          fi

      - name: Diagnostics
        run: |
          echo "--- SDK ---"; ls -la /usr/lib/android-sdk || true
          ls /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms /usr/lib/android-sdk/platform-tools /usr/lib/android-sdk/cmdline-tools || true
          echo "--- templates ---"; ls -la ~/.local/share/godot/export_templates/*/ | head -30 || true
          echo "--- editor settings ---"; cat ~/.config/godot/editor_settings-4.tres | head -20 || true
          echo "--- java ---"; which java javac; java -version 2>&1 | head -1

      - name: Export debug APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/MindBastion.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MindBastion-apk
          path: build/android/MindBastion.apk
