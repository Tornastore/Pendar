name: Deploy Web App to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build-web:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Web export template for this runner
        shell: bash
        run: |
          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          DEST="$HOME/.local/share/godot/export_templates"
          mkdir -p "$DEST"
          if [ -d "$SRC" ] && [ "$SRC" != "$DEST/${GODOT_VERSION}.stable" ]; then
            cp -a "$SRC" "$DEST/"
          fi
          test -d "$DEST/${GODOT_VERSION}.stable" || {
            echo "Missing Godot ${GODOT_VERSION} export templates in the CI image." >&2
            exit 1
          }

      - name: Import project resources
        run: godot --headless --editor --path . --import

      - name: Export Web app
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          find build/web -maxdepth 1 -type f -printf '%f %k KB\n' | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
