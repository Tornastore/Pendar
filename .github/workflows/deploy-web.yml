name: Deploy Web App to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build-web:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Web export template for this runner
        shell: bash
        run: |
          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          DEST="$HOME/.local/share/godot/export_templates"
          mkdir -p "$DEST"
          if [ -d "$SRC" ] && [ "$SRC" != "$DEST/${GODOT_VERSION}.stable" ]; then
            cp -a "$SRC" "$DEST/"
          fi
          test -d "$DEST/${GODOT_VERSION}.stable" || {
            echo "Missing Godot ${GODOT_VERSION} export templates in the CI image." >&2
            exit 1
          }

      - name: Download embedded Persian fonts (Vazirmatn, OFL-1.1)
        shell: bash
        run: |
          mkdir -p fonts
          download_font() {
            local filename="$1"
            local destination="fonts/${filename}"
            local primary_url="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/ttf/${filename}"
            local fallback_url="https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/${filename}"

            if wget --tries=3 --waitretry=2 --timeout=30 --output-document="$destination" "$primary_url"; then
              :
            else
              echo "Primary font URL failed; trying the GitHub mirror for ${filename}." >&2
              rm -f "$destination"
              wget --tries=3 --waitretry=2 --timeout=30 --output-document="$destination" "$fallback_url"
            fi

            if [ ! -s "$destination" ]; then
              echo "ERROR: Persian font download failed or produced an empty file: ${destination}" >&2
              return 1
            fi
          }
          download_font "Vazirmatn-Regular.ttf"
          download_font "Vazirmatn-Bold.ttf"
          ls -lh fonts/Vazirmatn-*.ttf

      - name: Import project resources
        run: godot --headless --editor --path . --import

      - name: Export Web app
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          find build/web -maxdepth 1 -type f -printf '%f %k KB\n' | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
