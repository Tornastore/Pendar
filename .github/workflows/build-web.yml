name: Build PENDAR Web App (artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-artifact-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends python3
          fi
          python3 --version

      - name: Install Web export template
        shell: bash
        timeout-minutes: 2
        run: |
          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          DEST="$HOME/.local/share/godot/export_templates"
          mkdir -p "$DEST"
          if [ -d "$SRC" ] && [ "$SRC" != "$DEST/${GODOT_VERSION}.stable" ]; then
            cp -a "$SRC" "$DEST/"
          fi
          test -d "$DEST/${GODOT_VERSION}.stable" || {
            echo "ERROR: Godot ${GODOT_VERSION} export templates are missing." >&2
            exit 1
          }

      - name: Download Persian fonts (Vazirmatn)
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p fonts
          download_font() {
            local filename="$1"
            local destination="fonts/${filename}"
            local primary_url="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/ttf/${filename}"
            local fallback_url="https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/${filename}"

            if ! wget --tries=2 --waitretry=2 --timeout=20 --output-document="$destination" "$primary_url"; then
              echo "Primary font URL failed; trying fallback for ${filename}." >&2
              rm -f "$destination"
              wget --tries=2 --waitretry=2 --timeout=20 --output-document="$destination" "$fallback_url"
            fi
            test -s "$destination" || {
              echo "ERROR: Font download failed: ${destination}" >&2
              return 1
            }
          }
          download_font "Vazirmatn-Regular.ttf"
          download_font "Vazirmatn-Bold.ttf"
          if ! wget --tries=2 --waitretry=2 --timeout=20 --output-document=fonts/OFL.txt "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt"; then
            wget --tries=2 --waitretry=2 --timeout=20 --output-document=fonts/OFL.txt "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/OFL.txt"
          fi
          test -s fonts/OFL.txt
          ls -lh fonts/Vazirmatn-*.ttf fonts/OFL.txt

      - name: Import project resources
        shell: bash
        timeout-minutes: 8
        run: godot --headless --editor --path . --import

      - name: Run chess rules regression tests
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/pendar-chess-regression.log"
          godot --headless --path . --script res://tests/godot/test_chess_rules.gd 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|CHESS_RULES_TESTS: .*failures=[1-9][0-9]*' "$LOG_FILE"; then
            echo "ERROR: Chess rules regression tests reported script/runtime errors." >&2
            exit 1
          fi
          if ! grep -E 'CHESS_RULES_TESTS: checks=[0-9]+, failures=0' "$LOG_FILE"; then
            echo "ERROR: Chess rules regression test summary is missing or non-zero." >&2
            exit 1
          fi

      - name: Run backgammon rules and presentation regression tests
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/pendar-backgammon-regression.log"
          godot --headless --path . --script res://tests/godot/test_backgammon_rules.gd 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|BACKGAMMON_RULES_TESTS: .*failures=[1-9][0-9]*' "$LOG_FILE"; then
            echo "ERROR: Backgammon regression tests reported script/runtime errors." >&2
            exit 1
          fi
          if ! grep -E 'BACKGAMMON_RULES_TESTS: checks=[0-9]+, failures=0' "$LOG_FILE"; then
            echo "ERROR: Backgammon regression test summary is missing or non-zero." >&2
            exit 1
          fi

      - name: Run domino rules and presentation regression tests
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/pendar-domino-regression.log"
          godot --headless --path . --script res://tests/godot/test_domino_rules.gd 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|DOMINO_RULES_TESTS: .*failures=[1-9][0-9]*' "$LOG_FILE"; then
            echo "ERROR: Domino regression tests reported script/runtime errors." >&2
            exit 1
          fi
          if ! grep -E 'DOMINO_RULES_TESTS: checks=[0-9]+, failures=0' "$LOG_FILE"; then
            echo "ERROR: Domino regression test summary is missing or non-zero." >&2
            exit 1
          fi

      - name: Run UNO rules regression tests
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/pendar-uno-regression.log"
          godot --headless --path . --script res://tests/godot/test_uno_rules.gd 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|UNO_RULES_TESTS: .*failures=[1-9][0-9]*' "$LOG_FILE"; then
            echo "ERROR: UNO regression tests reported script/runtime errors." >&2
            exit 1
          fi
          if ! grep -E 'UNO_RULES_TESTS: checks=[0-9]+, failures=0' "$LOG_FILE"; then
            echo "ERROR: UNO regression test summary is missing or non-zero." >&2
            exit 1
          fi

      - name: Run Mastermind rules regression tests
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/pendar-mastermind-regression.log"
          godot --headless --path . --script res://tests/godot/test_mastermind_rules.gd 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|MASTERMIND_RULES_TESTS: .*failures=[1-9][0-9]*' "$LOG_FILE"; then
            echo "ERROR: Mastermind regression tests reported script/runtime errors." >&2
            exit 1
          fi
          if ! grep -E 'MASTERMIND_RULES_TESTS: checks=[0-9]+, failures=0' "$LOG_FILE"; then
            echo "ERROR: Mastermind regression test summary is missing or non-zero." >&2
            exit 1
          fi

      - name: Run Quarto rules regression tests
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/pendar-quarto-regression.log"
          godot --headless --path . --script res://tests/godot/test_quarto_rules.gd 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|QUARTO_RULES_TESTS: .*failures=[1-9][0-9]*' "$LOG_FILE"; then
            echo "ERROR: Quarto regression tests reported script/runtime errors." >&2
            exit 1
          fi
          if ! grep -E 'QUARTO_RULES_TESTS: checks=[0-9]+, failures=0' "$LOG_FILE"; then
            echo "ERROR: Quarto regression summary was not found." >&2
            exit 1
          fi

      - name: Run Pentago rules regression tests
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/pendar-pentago-regression.log"
          godot --headless --path . --script res://tests/godot/test_pentago_rules.gd 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|PENTAGO_RULES_TESTS: .*failures=[1-9][0-9]*' "$LOG_FILE"; then
            echo "ERROR: Pentago regression tests reported script/runtime errors." >&2
            exit 1
          fi
          if ! grep -E 'PENTAGO_RULES_TESTS: checks=[0-9]+, failures=0' "$LOG_FILE"; then
            echo "ERROR: Pentago regression test summary is missing or non-zero." >&2
            exit 1
          fi

      - name: Smoke-test game startup
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/pendar-godot-startup.log"
          godot --headless --verbose --path . --quit-after 2 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed loading resource|Failed to load script|Cannot load script' "$LOG_FILE"; then
            echo "ERROR: Godot reported script or resource loading errors during startup." >&2
            exit 1
          fi

      - name: Export Web app
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html || {
            echo "ERROR: Web export did not create build/web/index.html." >&2
            exit 1
          }
          python3 tools/brand_web_export.py build/web
          find build/web -maxdepth 1 -type f -printf '%f %k KB\n' | sort

      - name: Upload Web app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pendar-Web
          path: build/web/
          if-no-files-found: error
          retention-days: 30
