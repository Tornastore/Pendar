name: Build Web App (artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-artifact-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Web export template
        shell: bash
        timeout-minutes: 2
        run: |
          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          DEST="$HOME/.local/share/godot/export_templates"
          mkdir -p "$DEST"
          if [ -d "$SRC" ] && [ "$SRC" != "$DEST/${GODOT_VERSION}.stable" ]; then
            cp -a "$SRC" "$DEST/"
          fi
          test -d "$DEST/${GODOT_VERSION}.stable" || {
            echo "ERROR: Godot ${GODOT_VERSION} export templates are missing." >&2
            exit 1
          }

      - name: Download Persian fonts (Vazirmatn)
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p fonts
          download_font() {
            local filename="$1"
            local destination="fonts/${filename}"
            local primary_url="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/ttf/${filename}"
            local fallback_url="https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/${filename}"

            if ! wget --tries=2 --waitretry=2 --timeout=20 --output-document="$destination" "$primary_url"; then
              echo "Primary font URL failed; trying fallback for ${filename}." >&2
              rm -f "$destination"
              wget --tries=2 --waitretry=2 --timeout=20 --output-document="$destination" "$fallback_url"
            fi
            test -s "$destination" || {
              echo "ERROR: Font download failed: ${destination}" >&2
              return 1
            }
          }
          download_font "Vazirmatn-Regular.ttf"
          download_font "Vazirmatn-Bold.ttf"
          if ! wget --tries=2 --waitretry=2 --timeout=20 --output-document=fonts/OFL.txt "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt"; then
            wget --tries=2 --waitretry=2 --timeout=20 --output-document=fonts/OFL.txt "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/OFL.txt"
          fi
          test -s fonts/OFL.txt
          ls -lh fonts/Vazirmatn-*.ttf fonts/OFL.txt

      - name: Import project resources
        shell: bash
        timeout-minutes: 8
        run: godot --headless --editor --path . --import

      - name: Smoke-test game startup
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          LOG_FILE="/tmp/mind-bastion-godot-startup.log"
          godot --headless --verbose --path . --quit-after 2 2>&1 | tee "$LOG_FILE"
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed loading resource|Failed to load script|Cannot load script' "$LOG_FILE"; then
            echo "ERROR: Godot reported script or resource loading errors during startup." >&2
            exit 1
          fi

      - name: Export Web app
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html || {
            echo "ERROR: Web export did not create build/web/index.html." >&2
            exit 1
          }
          find build/web -maxdepth 1 -type f -printf '%f %k KB\n' | sort

      - name: Upload Web app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindBastion-Web
          path: build/web/
          if-no-files-found: error
          retention-days: 30
